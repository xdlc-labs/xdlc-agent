<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xdlc — xdlc-agent console</title>
    <meta
      name="description"
      content="Ops console for xdlc-agent: activity, gates, repos, Fix / Promote / Revert."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonts load without blocking first paint: the sheet is requested with
      media="print" (low priority, never render-blocking) and switched to
      "all" once it has arrived. The system fallback stack in styles.css
      paints in the meantime. Without JS the noscript link applies it
      the ordinary way.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap"
      />
    </noscript>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.png" type="image/png" />
    <script>
      // Inline boot script — runs before paint to avoid a flash of the
      // wrong theme. Mirrors the storage key + fallback logic in
      // src/lib/theme.ts (kept in sync manually; small and stable).
      (function () {
        try {
          var k = "xdlc_theme";
          var s = localStorage.getItem(k);
          var t =
            s === "light" || s === "dark"
              ? s
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
