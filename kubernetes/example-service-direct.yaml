# Smoke test pod when cluster networking (kube-proxy) is degraded.
# bootstrap-minikube falls back to this if helm service isn't reachable.
apiVersion: v1
kind: Pod
metadata:
  name: example-service-direct
  namespace: dev
  labels:
    app: example-service
spec:
  containers:
    - name: app
      image: example-service:local
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8080
          hostPort: 18080
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 5
  restartPolicy: Always
