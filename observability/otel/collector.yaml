# OTel Collector: apps push OTLP; fan-out to a PromQL-compatible store.
# Default exporter: Prometheus remote_write (kube-prometheus-stack with
# enableRemoteWriteReceiver). Swap exporter blocks for VictoriaMetrics or
# OpenObserve — see comments below and docs/deployment.md.
#
# Pin bumped with Collector releases (~biweekly). logging→debug (0.111+);
# prometheusremotewrite→prometheus_remote_write (0.154+).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch:
        timeout: 5s
    exporters:
      # Default: Prometheus (or any remote_write endpoint).
      prometheus_remote_write:
        endpoint: http://kube-prometheus-kube-prome-prometheus.monitoring.svc:9090/api/v1/write
      # VictoriaMetrics:
      # prometheus_remote_write:
      #   endpoint: http://victoria-metrics.monitoring.svc:8428/api/v1/write
      # OpenObserve (native OTLP):
      # otlphttp:
      #   endpoint: http://openobserve.monitoring.svc:5080/api/default
      #   headers:
      #     Authorization: "Basic ${OPENOBSERVE_TOKEN}"
      debug:
        verbosity: basic
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus_remote_write, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.160.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
