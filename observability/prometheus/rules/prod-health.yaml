# PrometheusRule (Prometheus Operator CRD) mirroring the same thresholds
# as config.yaml's gates.prod-health — Alertmanager fires these for
# humans (Slack/PagerDuty) in parallel with xdlc-agent's own poller
# (internal/poller + gate.ProdHealthGate) driving the auto-revert.
#
# KNOWN LIMITATION — hand-synced thresholds (no templating; out of scope,
# see docs/gates.md for the "templating both from one source" backlog
# idea): the numbers below in HighP95Latency/HighErrorRate must be kept
# equal, by hand, to:
#   - config.yaml:39-42                        gates.prod-health.thresholds
#     (p95_ms: 500, error_rate: 0.01) + interval: 30s
#   - internal/config/config.go:213-225        ProdHealthGateConfig
#     (struct shape + Interval field + defaults)
#   - internal/config/config.go:237-240        Thresholds{P95MS, ErrorRate}
# A repo-level override (Repo.Thresholds, config.go:49-51) changes the
# gate's own pass/fail decision but is NOT reflected here — this file's
# thresholds are one org-wide reference set (matching config.yaml's
# single example-service repo), not per-repo. If you tighten/loosen a
# repo's thresholds in config.yaml, consider whether these Alertmanager
# rules still make sense as a human-facing early warning for it. See also
# docs/deployment.md's "Alerting" note for the same reminder from the
# config side.
#
# gate/repo labels on the two new rules below (PollerStale, StoreErrors)
# come straight from the xdlc_agent_poller_last_tick_timestamp_seconds /
# xdlc_agent_store_errors_total series — no hand-sync needed for those,
# only the static "repo: example-service" label follows this file's
# existing single-example-service convention (see internal/otel/otel.go
# and internal/poller/poller.go for where they're recorded).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prod-health
  namespace: monitoring
spec:
  groups:
    - name: prod-health
      rules:
        - alert: HighP95Latency
          expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) * 1000 > 500
          for: 2m
          labels:
            severity: warning
            repo: example-service
          annotations:
            summary: p95 latency above 500ms
        - alert: HighErrorRate
          expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service) > 0.01
          for: 2m
          labels:
            severity: critical
            repo: example-service
          annotations:
            summary: error rate above 1%
        # Poller staleness: internal/poller records this gauge (Unix
        # seconds) on every tick attempt, per gate/repo, regardless of
        # Gate.Check outcome — see internal/poller/poller.go's tick().
        # Threshold is 3x the 30s default gates.prod-health.interval
        # (config.yaml:42) — if a poller stops ticking, xdlc-agent's own
        # auto-revert for that repo/gate goes blind, which is why this is
        # severity: critical rather than warning.
        - alert: ProdHealthPollerStale
          expr: time() - max(xdlc_agent_poller_last_tick_timestamp_seconds{gate="prod-health"}) by (repo) > 90
          for: 1m
          labels:
            severity: critical
            repo: example-service
          annotations:
            summary: prod-health poller has not ticked in over 90s (3x its 30s default interval) — auto-revert safety net is blind for this repo
        # PVC/bbolt store errors: internal/store.AuditStore.Append/All
        # increment this counter (op=append|all) on any bbolt read/write
        # failure — see internal/store/audit.go's countError(). The audit
        # DB lives on the agent's PVC (docs/deployment.md's Persistence
        # section); a nonzero rate usually means disk pressure, a full
        # volume, or file-lock contention.
        - alert: ProdHealthStoreErrors
          expr: sum(rate(xdlc_agent_store_errors_total[5m])) > 0
          for: 5m
          labels:
            severity: critical
            repo: example-service
          annotations:
            summary: bbolt audit store (PVC-backed) read/write errors — check PVC health, disk pressure, and file-lock contention
