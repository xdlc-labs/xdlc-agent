# Cloud defaults for EKS. Use with the chart:
#   helm upgrade --install xdlc-agent deploy/helm/xdlc-agent \
#     -f deploy/overlays/eks/values.yaml ...
#
# Starter overlay — pair with infra/aws-eks (EBS CSI + gp3).

replicaCount: 1

config: |
  repos: []
  gates:
    ci:
      trigger: on_push
    dev-smoke:
      trigger: on_sync
      namespace: dev
      interval: 30s
    prod-health:
      trigger: continuous
      metrics_url: ""
      thresholds:
        p95_ms: 500
        error_rate: 0.01
      interval: 30s
  server:
    addr: ":8080"
    require_webhook_secret: true
  agent:
    mode: subprocess
    provider: claude
    timeout: 10m

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

persistence:
  enabled: true
  size: 10Gi
  # Requires aws-ebs-csi-driver (enabled in infra/aws-eks). Override if your
  # cluster uses a different default StorageClass.
  storageClassName: gp3
