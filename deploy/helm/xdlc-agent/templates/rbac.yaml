{{- if .Values.role.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "xdlc-agent.fullname" . }}
  namespace: {{ .Values.role.namespace }}
  labels:
    {{- include "xdlc-agent.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.role.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "xdlc-agent.fullname" . }}
  namespace: {{ .Values.role.namespace }}
  labels:
    {{- include "xdlc-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "xdlc-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "xdlc-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
