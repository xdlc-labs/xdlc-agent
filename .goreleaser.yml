version: 2

builds:
  - id: xdlc-agent
    main: ./cmd/xdlc-agent
    binary: xdlc-agent
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - id: xdlc-agent
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers:
  - ids:
      - xdlc-agent
    image_templates:
      - "ghcr.io/xdlc-labs/xdlc-agent:{{ .Version }}-amd64"
    dockerfile: deploy/Dockerfile.release
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
  - ids:
      - xdlc-agent
    image_templates:
      - "ghcr.io/xdlc-labs/xdlc-agent:{{ .Version }}-arm64"
    dockerfile: deploy/Dockerfile.release
    use: buildx
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/xdlc-labs/xdlc-agent:{{ .Version }}"
    image_templates:
      - "ghcr.io/xdlc-labs/xdlc-agent:{{ .Version }}-amd64"
      - "ghcr.io/xdlc-labs/xdlc-agent:{{ .Version }}-arm64"
  - name_template: "ghcr.io/xdlc-labs/xdlc-agent:latest"
    image_templates:
      - "ghcr.io/xdlc-labs/xdlc-agent:{{ .Version }}-amd64"
      - "ghcr.io/xdlc-labs/xdlc-agent:{{ .Version }}-arm64"

release:
  github:
    owner: xdlc-labs
    name: xdlc-agent
  prerelease: auto
  name_template: "v{{.Version}}"
