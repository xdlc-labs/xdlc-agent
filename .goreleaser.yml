version: 2

builds:
  - id: xdlc-agent
    main: ./cmd/xdlc-agent
    binary: xdlc
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - id: xdlc-agent
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# linux/amd64 only — arm64 via QEMU was the release time sink.
# Re-add arm64 (+ :latest) when we have a native arm runner / first GA.
dockers:
  - ids:
      - xdlc-agent
    image_templates:
      - "ghcr.io/xdlc-labs/xdlc-agent:{{ .Version }}"
    dockerfile: deploy/Dockerfile.release
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"

release:
  github:
    owner: xdlc-labs
    name: xdlc-agent
  prerelease: auto
  name_template: "v{{.Version}}"
