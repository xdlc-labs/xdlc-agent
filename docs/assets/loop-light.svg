<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-label="xdlc: signals from CI, DEV smoke and prod health enter a policy gate that decides Fix, Promote, Revert or noop; only Fix reaches the coding agent, which runs in a per-Fix git worktree on your own host"><defs><marker id="a-mid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#57606a"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8c959f"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1a7f37"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#cf222e"/></marker></defs><rect x="166" y="52" width="520" height="350" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1" stroke-dasharray="5 4"/><text x="180" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8250df" font-weight="600">your host  ·  your keys  ·  nothing phones home</text><rect x="8" y="102" width="122" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="22" cy="120" r="4" fill="#cf222e"/><text x="34" y="124" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" font-weight="600">CI red</text><text x="20" y="141" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#57606a">workflow_run: failure</text><rect x="8" y="190" width="122" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="22" cy="208" r="4" fill="#1a7f37"/><text x="34" y="212" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" font-weight="600">DEV green</text><text x="20" y="229" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#57606a">smoke probe passed</text><rect x="8" y="246" width="122" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="22" cy="264" r="4" fill="#cf222e"/><text x="34" y="268" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" font-weight="600">prod breach</text><text x="20" y="285" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#57606a">p95 over threshold</text><rect x="182" y="88" width="118" height="214" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="196" y="114" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328" font-weight="700">policy</text><text x="196" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#57606a">decides before</text><text x="196" y="146" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#57606a">anything runs</text><line x1="196" y1="160" x2="286" y2="160" stroke="#d0d7de" stroke-width="1"/><text x="196" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#57606a">flap detection</text><text x="196" y="195" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#57606a">circuit breaker</text><text x="196" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#57606a">depends_on</text><text x="196" y="225" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#57606a">budgets, caps</text><rect x="340" y="84" width="330" height="108" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/><text x="356" y="108" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328" font-weight="700">Fix</text><text x="392" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#0969da">the only path to the agent</text><text x="356" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606a">1. git worktree per Fix, on a scratch branch</text><text x="356" y="147" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606a">2. your agent CLI runs in it, with the failing logs</text><text x="356" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606a">3. the agent commits, xdlc pushes</text><text x="356" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#8c959f">claude · codex · cursor · gemini</text><line x1="130" y1="126" x2="175" y2="126" stroke="#57606a" stroke-width="1.5" marker-end="url(#a-mid)"/><line x1="130" y1="214" x2="175" y2="214" stroke="#57606a" stroke-width="1.5" marker-end="url(#a-mid)"/><line x1="130" y1="270" x2="175" y2="270" stroke="#57606a" stroke-width="1.5" marker-end="url(#a-mid)"/><line x1="300" y1="126" x2="333" y2="126" stroke="#57606a" stroke-width="1.5" marker-end="url(#a-mid)"/><text x="320" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#1f2328" font-weight="700" text-anchor="middle">fix</text><line x1="300" y1="214" x2="717" y2="214" stroke="#57606a" stroke-width="1.5" marker-end="url(#a-mid)"/><text x="312" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#1f2328" font-weight="700">promote</text><line x1="300" y1="270" x2="717" y2="270" stroke="#57606a" stroke-width="1.5" marker-end="url(#a-mid)"/><text x="312" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#1f2328" font-weight="700">revert</text><line x1="241" y1="302" x2="241" y2="323" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a-faint)"/><text x="188" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8c959f" font-weight="700">noop — where most signals end</text><line x1="670" y1="126" x2="717" y2="126" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#a-green)"/><rect x="724" y="92" width="168" height="68" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/><text x="738" y="113" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" font-weight="600">pull request</text><text x="738" y="129" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#57606a">agent's summary, run link</text><text x="738" y="143" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#1a7f37">green checks, cost recorded</text><rect x="724" y="190" width="168" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="738" y="211" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" font-weight="600">develop → main</text><text x="738" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#57606a">fast-forward, gated SHA</text><rect x="724" y="246" width="168" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="738" y="267" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" font-weight="600">main reverted</text><text x="738" y="283" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#57606a">before anyone pages you</text><rect x="182" y="356" width="488" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="198" y="378" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606a">every action recorded: prompt · agent output · diff · verdict · cost</text><path d="M808,92 V32 Q808,22 798,22 H79 Q69,22 69,32 V95" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a-faint)"/><text x="450" y="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8c959f" text-anchor="middle">the outcome is what the next signal measures</text></svg>