<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-label="Signals from CI, DEV smoke and prod health enter a policy gate that returns Fix, Promote, Revert or noop. Only Fix reaches a coding agent, which runs in a per-Fix git worktree on your own host. Every action is recorded with its prompt, diff, verdict and cost."><defs><marker id="a-mid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#57606a"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8c959f"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1a7f37"/></marker></defs><rect x="168" y="52" width="520" height="350" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1" stroke-dasharray="5 4"/><text x="182" y="73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8250df" font-weight="600">your host · your keys · nothing phones home</text><rect x="8" y="102" width="140" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="23" cy="119" r="4" fill="#cf222e"/><text x="35" y="123" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" font-weight="600">CI red</text><text x="21" y="141" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606a">workflow_run failed</text><rect x="8" y="190" width="140" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="23" cy="207" r="4" fill="#1a7f37"/><text x="35" y="211" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" font-weight="600">DEV green</text><text x="21" y="229" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606a">smoke probe passed</text><rect x="8" y="246" width="140" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="23" cy="263" r="4" fill="#cf222e"/><text x="35" y="267" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" font-weight="600">prod breach</text><text x="21" y="285" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606a">p95 over budget</text><rect x="184" y="88" width="126" height="214" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="198" y="115" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328" font-weight="700">policy</text><text x="198" y="134" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">decides before</text><text x="198" y="149" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">anything runs</text><line x1="198" y1="164" x2="296" y2="164" stroke="#d0d7de" stroke-width="1"/><text x="198" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606a">flap detect</text><text x="198" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606a">circuit break</text><text x="198" y="219" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606a">depends_on</text><text x="198" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606a">budgets</text><rect x="344" y="84" width="326" height="108" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/><text x="360" y="109" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328" font-weight="700">Fix</text><text x="398" y="109" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da">the only path to an agent</text><text x="360" y="131" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#57606a">1. a git worktree per Fix</text><text x="360" y="149" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#57606a">2. your agent CLI, given the failing logs</text><text x="360" y="167" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#57606a">3. the agent commits, xdlc pushes</text><text x="360" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8c959f">claude · codex · cursor · gemini</text><line x1="148" y1="126" x2="177" y2="126" stroke="#57606a" stroke-width="1.5" marker-end="url(#a-mid)"/><line x1="148" y1="214" x2="177" y2="214" stroke="#57606a" stroke-width="1.5" marker-end="url(#a-mid)"/><line x1="148" y1="270" x2="177" y2="270" stroke="#57606a" stroke-width="1.5" marker-end="url(#a-mid)"/><line x1="310" y1="126" x2="337" y2="126" stroke="#57606a" stroke-width="1.5" marker-end="url(#a-mid)"/><text x="327" y="117" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#1f2328" font-weight="700" text-anchor="middle">fix</text><line x1="310" y1="214" x2="715" y2="214" stroke="#57606a" stroke-width="1.5" marker-end="url(#a-mid)"/><text x="322" y="205" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#1f2328" font-weight="700">promote</text><line x1="310" y1="270" x2="715" y2="270" stroke="#57606a" stroke-width="1.5" marker-end="url(#a-mid)"/><text x="322" y="261" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#1f2328" font-weight="700">revert</text><line x1="247" y1="302" x2="247" y2="323" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a-faint)"/><text x="188" y="348" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8c959f" font-weight="700">noop — where most signals end</text><line x1="670" y1="126" x2="715" y2="126" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#a-green)"/><rect x="722" y="90" width="170" height="72" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/><text x="736" y="111" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" font-weight="600">pull request</text><text x="736" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606a">the agent's summary</text><text x="736" y="145" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#1a7f37">cost recorded</text><rect x="722" y="189" width="170" height="50" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="736" y="210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" font-weight="600">develop → main</text><text x="736" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606a">fast-forward only</text><rect x="722" y="245" width="170" height="50" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="736" y="266" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" font-weight="600">main reverted</text><text x="736" y="283" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606a">before you get paged</text><rect x="184" y="358" width="486" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="200" y="380" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#57606a">recorded per action: prompt · output · diff · verdict · cost</text><path d="M807,88 V32 Q807,22 797,22 H88 Q78,22 78,32 V95" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a-faint)"/><text x="450" y="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8c959f" text-anchor="middle">the outcome is what the next signal measures</text></svg>