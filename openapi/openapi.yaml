# Source of truth for /api/* — keep in sync with internal/api.Mount.
# Drift: go test ./internal/api -run TestOpenAPI
openapi: "3.1.0"
info:
  title: xdlc-agent ops API
  version: "0.1.0"
  description: Dashboard JSON + operator actions on the daemon mux.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      summary: Liveness (no auth)
      security: []
      responses:
        "200":
          description: Daemon running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/whoami:
    get:
      summary: Caller role (operator|viewer)
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: { type: string, enum: [operator, viewer] }
  /api/overview:
    get:
      summary: Console home snapshot
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /api/history:
    get:
      summary: Audit event history
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
        - name: repo
          in: query
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
  /api/backlog:
    get:
      summary: BACKLOG.md contents
      parameters:
        - name: repo
          in: query
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [markdown]
                properties:
                  markdown: { type: string }
  /api/repos:
    get:
      summary: Watched repos
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [repos]
                properties:
                  repos:
                    type: array
                    items: { $ref: "#/components/schemas/Repo" }
  /api/repos/{id}:
    get:
      summary: One repo + timeline
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [repo, timeline]
                properties:
                  repo: { $ref: "#/components/schemas/Repo" }
                  timeline:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
  /api/events:
    get:
      summary: SSE audit fan-out
      description: >-
        Audit records ride the default (unnamed) event with the audit
        sequence as the SSE id. Two named events share the stream and
        carry no id: "fix_state" (an ActiveFix, on every phase change,
        plus one per running Fix on connect) and "fix_output" (a
        FixOutput chunk of what a running Fix's agent printed, rendered
        to prose, tool calls and the result; on connect one snapshot per
        running Fix that has printed anything). A client written before
        either keeps working: its onmessage never sees named events.
      parameters:
        - name: access_token
          in: query
          description: Bearer for EventSource (cannot set Authorization)
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream of Event JSON
  /api/fixes/active:
    get:
      summary: Fixes in flight right now
      description: >-
        The live half of the audit trail: one entry per running Fix with
        the phase it is in and when it entered it. An empty list means no
        Fix is running. Transitions are also streamed over /api/events as
        the named event "fix_state" carrying the same object.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [fixes]
                properties:
                  fixes:
                    type: array
                    items: { $ref: "#/components/schemas/ActiveFix" }
  /api/sessions:
    get:
      summary: Fix recordings, newest first (operator)
      description: >-
        The session directories under agent.sessions.dir. Recordings are
        unscrubbed — a prompt embeds CI logs — so every /api/sessions route
        requires the operator role; the viewer token gets 403. With
        recording disabled the list is empty and enabled is false.
      parameters:
        - name: repo
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [sessions, enabled]
                properties:
                  enabled: { type: boolean }
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "403":
          description: viewer role
  /api/sessions/{id}:
    get:
      summary: One recording's meta, file list and output tail (operator)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [session, files, output_tail]
                properties:
                  session: { $ref: "#/components/schemas/Session" }
                  files:
                    type: array
                    items: { type: string }
                    description: File names present in the session directory.
                  output_tail:
                    type: string
                    description: Last 60 lines the agent printed on its final attempt.
        "404":
          description: unknown session, or recording disabled
  /api/sessions/{id}/diff:
    get:
      summary: The patch the Fix produced (operator)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/plain unified diff
        "404":
          description: the run delivered no patch, or unknown session
  /api/sessions/{id}/prompt:
    get:
      summary: The prompt the agent was given (operator)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: attempt
          in: query
          description: 1-based agent run within the Fix; default 1.
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: text/plain, unscrubbed
        "404":
          description: no prompt for that attempt, or unknown session
  /api/sessions/{id}/output:
    get:
      summary: Everything the agent printed (operator)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: attempt
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: text/plain
        "404":
          description: no output for that attempt, or unknown session
  /api/prs:
    get:
      summary: Fix-PR work queue
      parameters:
        - name: all
          in: query
          description: "1 = include merged/closed"
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [prs]
                properties:
                  prs:
                    type: array
                    items: { $ref: "#/components/schemas/FixPR" }
  /api/kpis:
    get:
      summary: Fix cost / outcome KPIs
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostKPIs"
  /api/actions/fix:
    post:
      summary: Enqueue manual Fix (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionBody" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionEnqueued" }
  /api/actions/promote:
    post:
      summary: Enqueue manual Promote (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionBody" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionEnqueued" }
  /api/actions/revert:
    post:
      summary: Enqueue manual Revert (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionBody" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionEnqueued" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Health:
      type: object
      properties:
        status: { type: string }
        version: { type: string }
        agentProvider: { type: string }
        configPath: { type: string }
        uptime: { type: string }
        addr: { type: string }
    ActionBody:
      type: object
      required: [repo, confirm]
      properties:
        repo: { type: string }
        confirm: { type: boolean }
        instructions:
          type: string
          maxLength: 4096
          description: >-
            Optional operator note for a manual Fix — what you would tell a
            coding agent yourself ("the flake is in the seed data").
            Joins the prompt's trusted block after the repo rules.
            Ignored for promote and revert. Only its length is audited.
    ActionEnqueued:
      type: object
      properties:
        enqueued: { type: boolean }
        action: { type: string }
        repo: { type: string }
        source: { type: string }
        kind: { type: string }
    Event:
      type: object
      properties:
        id: { type: string }
        ts: { type: string }
        repo: { type: string }
        source: { type: string }
        gate: { type: string }
        signal: { type: string }
        action: { type: string }
        ok: { type: boolean }
        evidence: { type: string }
        url: { type: string }
        chain_id: { type: string }
        seq: { type: integer }
        session_id:
          type: string
          description: >-
            Key into /api/sessions/{id} for a Fix that was recorded. Empty
            for gate signals and when recording is off.
        error:
          type: string
          description: >-
            The dispatch error when ok is false — a rejected Promote push,
            a Revert that found a human's commit at the prod tip, a Fix
            whose agent failed. Empty when the action happened.
    Session:
      type: object
      description: meta.json of one Fix recording (internal/session.Meta).
      required: [id, repo, source, kind, provider, started_at]
      properties:
        id: { type: string }
        repo: { type: string }
        source: { type: string }
        kind: { type: string }
        provider: { type: string }
        fix_mode: { type: string }
        manual: { type: boolean }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_ms: { type: integer }
        status: { type: string, enum: [ok, error, ""] }
        error: { type: string }
        base_sha: { type: string }
        head_sha: { type: string }
        branch: { type: string }
        changed_files: { type: integer }
        pr_url: { type: string }
        cost:
          type: object
          additionalProperties: true
          description: total_cost_usd, input_tokens, output_tokens, cache_* as the agent CLI reported them.
        attempts: { type: integer }
        outcome: { type: string, enum: [fixed, gave_up, needs_human, ""] }
        summary: { type: string }
    Repo:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        branch: { type: string }
        lastGate: { type: string }
        lastGateStatus: { type: string }
        lastAction: { type: string }
        lastActionAt: { type: string }
        devTag: { type: string }
        prodTag: { type: string }
        health: { type: string }
        cloneStatus: { type: string }
        lastPromote: { type: string }
        lastRevert: { type: string }
        argocdApp: { type: string }
        sloQueries:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              query: { type: string }
    Gate:
      type: object
      properties:
        name: { type: string }
        provider: { type: string }
        status: { type: string }
        lastCheck: { type: string }
        interval: { type: string }
        trigger: { type: string }
        evidence: { type: string }
        url: { type: string }
    Daemon:
      type: object
      properties:
        status: { type: string }
        version: { type: string }
        env: { type: string }
        uptime: { type: string }
        webhook: { type: string }
        configPath: { type: string }
        gitopsDir: { type: string }
        agentProvider: { type: string }
    OverviewKPIs:
      type: object
      properties:
        reposWatched: { type: integer }
        fixes: { type: integer }
        promotes: { type: integer }
        reverts: { type: integer }
        lastActionAt: { type: string }
        backlogOpen: { type: integer }
    Overview:
      type: object
      properties:
        daemon: { $ref: "#/components/schemas/Daemon" }
        pipeline:
          type: array
          items:
            type: object
            properties:
              stage: { type: string }
              label: { type: string }
              status: { type: string }
              detail: { type: string }
        kpis: { $ref: "#/components/schemas/OverviewKPIs" }
        gates:
          type: array
          items: { $ref: "#/components/schemas/Gate" }
        repos:
          type: array
          items: { $ref: "#/components/schemas/Repo" }
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        backlogMd: { type: string }
    ActiveFix:
      type: object
      properties:
        id:
          type: string
          description: >-
            Stable for the whole run, including the queued phase before a
            session directory exists.
        session_id:
          type: string
          description: >-
            The recording this Fix is writing, once it has one. Empty
            while queued, and for every run when session recording is off.
        repo: { type: string }
        source: { type: string }
        provider: { type: string }
        state:
          type: string
          description: >-
            Phase the Fix is in. A run skips what it does not do: no
            planning without agent.fix_plan, no pushing outside worktree
            mode, no verifying without agent.fix_reverify. "ok" and
            "error" are terminal and only ever arrive as an event — a
            finished Fix is not in this list.
          enum: [queued, cloning, planning, fixing, pushing, verifying, ok, error]
        since:
          type: string
          description: When the Fix entered this state, not when it started.
        attempt:
          type: integer
          description: 1-based agent run within this Fix (agent.fix_attempts ladder).
    FixOutput:
      type: object
      required: [id, text]
      description: >-
        One "fix_output" SSE event: a chunk of a running Fix's agent
        output. The daemon keeps the last 16 KiB per Fix, so a console is
        a live view, not the record; the session recording has it all.
      properties:
        id:
          type: string
          description: The ActiveFix id this output belongs to.
        repo: { type: string }
        text:
          type: string
          description: Newline-terminated rendered lines.
        snapshot:
          type: boolean
          description: >-
            When true, text is the whole tail kept so far and replaces what
            the client holds — sent on connect, and to a client that fell
            behind and had chunks dropped.
    FixPR:
      type: object
      properties:
        repo: { type: string }
        branch: { type: string }
        number: { type: integer }
        url: { type: string }
        state: { type: string }
        at: { type: string }
        merged: { type: boolean }
        title: { type: string }
        ci:
          type: string
          description: >-
            Aggregate CI state on the PR head, merging GitHub check runs
            and commit statuses. Empty means neither system reports a
            check (no CI configured, or the lookup failed) and is
            distinct from "pending".
          enum: ["", "pending", "success", "failure"]
        reviewer: { type: string }
        stale: { type: boolean }
    RepoKPI:
      type: object
      properties:
        repo: { type: string }
        fixes: { type: integer }
        reverts: { type: integer }
        promotes: { type: integer }
        total_cost_usd: { type: number }
        fix_success_rate: { type: ["number", "null"] }
        duration_p50_ms: { type: number }
        duration_p95_ms: { type: number }
    CostKPIs:
      type: object
      required: [totals, repos]
      properties:
        totals: { $ref: "#/components/schemas/RepoKPI" }
        repos:
          type: array
          items: { $ref: "#/components/schemas/RepoKPI" }
