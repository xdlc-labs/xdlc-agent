# yaml-language-server: $schema=./schema/config.schema.json
# CI Fix profile — the default install. Copy to config.yaml and edit.
# GitOps promote / prod revert: `xdlc init --profile gitops|full` or
# uncomment the blocks at the bottom (https://xdlc.dev/agent/docs/production-loop).

repos:
  - name: example-service
    github: xdlc-labs/example-service
    # branch MUST name the branch your CI runs on — it is the filter for
    # incoming workflow_run deliveries, and it is never guessed from the
    # repository. Point it at "main" if that is your trunk: a mismatch
    # means GitHub reports every delivery as accepted while the daemon
    # drops it (logged at WARN) and no Fix ever starts.
    branch: develop
    # prod_branch: main         # promote/revert target
    gates: [ci]

# github:  # optional — App preferred over GITHUB_TOKEN
#   app_id: 123456
#   installation_id: 12345678
#   private_key_env: GITHUB_APP_PRIVATE_KEY

server:
  addr: "127.0.0.1:8080"
  github_webhook_secret_env: GITHUB_WEBHOOK_SECRET
  require_webhook_secret: false
  # Loopback bind, so a webhook secret is not forced. To bind a
  # non-loopback address (":8080", 0.0.0.0, container, Kubernetes):
  # set require_webhook_secret: true and export GITHUB_WEBHOOK_SECRET
  # (plus ARGOCD_WEBHOOK_SECRET / ALERTMANAGER_WEBHOOK_SECRET if used).
  # The daemon refuses to start on a non-loopback addr while this is false.
  # webhook_rate_per_sec: 20
  # webhook_rate_burst: 40
  # oidc:
  #   issuer_url: https://accounts.example.com
  #   client_id: your-client-id
  #   client_secret_env: OIDC_CLIENT_SECRET
  #   redirect_url: https://xdlc-agent.example.com/auth/callback
  #   operator_groups: [platform-team]
  #   viewer_groups: []
  #   session_secret_env: OIDC_SESSION_SECRET
  #   session_ttl: 8h
  #   cookie_secure: true

gates:
  ci:
    trigger: on_push
    # workflows: [ci]  # optional. Empty = every workflow_run on the branch.

agent:
  mode: subprocess
  provider: claude # claude | codex | cursor | gemini
  timeout: 10m
  # max_concurrent_fixes: 2
  # fix_budget: 5m              # soft Fix deadline; 0 = unlimited (#9)
  # fix_mode: direct # or pr
  # fix_reverify: true          # require gate green after Fix (#2)
  #   Not with fix_mode "pr": the fix lands on a PR branch while the
  #   re-check reads the tracked branch, which stays red until the PR
  #   merges, so every Fix would fail. The daemon refuses that pair.
  # fix_attempts: 2             # re-run the agent when the gate is still red; needs fix_reverify
  # ci_rerun_before_fix: true  # flake ladder before agent (#3); default on
  # fix_plan: true              # diagnose then patch (#23); default off
  # worktree:                   # per-Fix git worktree; on by default
  #   enabled: false            # set false to share one clone per repo (old behavior)
  #   keep_failed: 24h          # how long a failed Fix's worktree stays for inspection
  # extra_env_keys: [HTTPS_PROXY]
  # rules_file: /etc/xdlc/rules.md  # instructions added to every Fix prompt
  # committer:                  # git identity Fix commits are attributed to
  #   name: xdlc-agent          # default; GIT_AUTHOR_NAME / git config user.name win
  #   email: xdlc-agent@users.noreply.github.com  # default; git config user.email wins
  # sessions:                       # prompt / output / diff per Fix (docs/sessions.md)
  #   enabled: true
  #   dir: sessions
  #   retain: 720h
  #   max_file_bytes: 2097152

# fleet:
#   flap_max_cycles: 3
#   flap_window: 2h
#   circuit_breach_ratio: 0.3
#   notify_webhook_url: https://hooks.slack.com/services/...
#   patient_zero: true          # Fix upstream on root_cause suppress (#4)

