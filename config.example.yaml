# yaml-language-server: $schema=./schema/config.schema.json
# CI Fix profile — the default install. Copy to config.yaml and edit.
# GitOps promote / prod revert: `xdlc init --profile gitops|full` or
# uncomment the blocks at the bottom (docs/production-loop.md).

repos:
  - name: example-service
    github: your-org/example-service
    gates: [ci]

# github:  # optional — App preferred over GITHUB_TOKEN
#   app_id: 123456
#   installation_id: 12345678
#   private_key_env: GITHUB_APP_PRIVATE_KEY

server:
  addr: ":8080"
  github_webhook_secret_env: GITHUB_WEBHOOK_SECRET
  require_webhook_secret: false # local-dev only; daemon refuses non-loopback when false
  # webhook_rate_per_sec: 20
  # webhook_rate_burst: 40
  # oidc:
  #   issuer_url: https://accounts.example.com
  #   client_id: your-client-id
  #   client_secret_env: OIDC_CLIENT_SECRET
  #   redirect_url: https://xdlc-agent.example.com/auth/callback
  #   operator_groups: [platform-team]
  #   viewer_groups: []
  #   session_secret_env: OIDC_SESSION_SECRET
  #   session_ttl: 8h
  #   cookie_secure: true

gates:
  ci:
    trigger: on_push

agent:
  mode: subprocess
  provider: claude # claude | codex | cursor | gemini
  timeout: 10m
  # max_concurrent_fixes: 2
  # fix_budget: 5m              # soft Fix deadline; 0 = unlimited (#9)
  # fix_mode: direct # or pr
  # fix_reverify: true          # require gate green after Fix (#2)
  # fix_attempts: 2             # re-run the agent when the gate is still red; needs fix_reverify
  # ci_rerun_before_fix: true  # flake ladder before agent (#3); default on
  # fix_plan: true              # diagnose then patch (#23); default off
  # worktree:                   # per-Fix git worktree; on by default
  #   enabled: false            # set false to share one clone per repo (old behavior)
  #   keep_failed: 24h          # how long a failed Fix's worktree stays for inspection
  # extra_env_keys: [HTTPS_PROXY]
  # rules_file: /etc/xdlc/rules.md  # instructions added to every Fix prompt
  # sessions:                       # prompt / output / diff per Fix (docs/sessions.md)
  #   enabled: true
  #   dir: sessions
  #   retain: 720h
  #   max_file_bytes: 2097152

# fleet:
#   flap_max_cycles: 3
#   flap_window: 2h
#   circuit_breach_ratio: 0.3
#   notify_webhook_url: https://hooks.slack.com/services/...
#   patient_zero: true          # Fix upstream on root_cause suppress (#4)

