# Example config — copy to config.yaml and edit.

repos:
  - name: example-service
    github: your-org/example-service
    gates: [ci, dev-smoke, prod-health]
    argocd_app: dev-example-service
    probe_job: smoke-e2e

# github:  # optional — App preferred over GITHUB_TOKEN
#   app_id: 123456
#   installation_id: 12345678
#   private_key_env: GITHUB_APP_PRIVATE_KEY

server:
  addr: ":8080"
  # api_token_env: XDL_API_TOKEN
  # api_viewer_token_env: XDL_API_VIEWER_TOKEN
  github_webhook_secret_env: GITHUB_WEBHOOK_SECRET
  argocd_webhook_secret_env: ARGOCD_WEBHOOK_SECRET
  alertmanager_webhook_secret_env: ALERTMANAGER_WEBHOOK_SECRET
  require_webhook_secret: false # local-dev only; daemon refuses non-loopback when false
  # webhook_rate_per_sec: 20
  # webhook_rate_burst: 40
  # oidc:
  #   issuer_url: https://accounts.example.com
  #   client_id: your-client-id
  #   client_secret_env: OIDC_CLIENT_SECRET
  #   redirect_url: https://xdlc-agent.example.com/auth/callback
  #   operator_groups: [platform-team]
  #   viewer_groups: []
  #   session_secret_env: OIDC_SESSION_SECRET
  #   session_ttl: 8h
  #   cookie_secure: true

gates:
  ci:
    trigger: on_push
  dev-smoke:
    trigger: on_sync
    namespace: dev
    interval: 30s
  prod-health:
    trigger: continuous
    metrics_url: http://prometheus.your-domain.io
    thresholds:
      p95_ms: 500
      error_rate: 0.01
    interval: 30s
    p95_query: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="{{repo}}"}[5m])) by (le)) * 1000
    error_rate_query: sum(rate(http_requests_total{service="{{repo}}",status=~"5.."}[5m])) / sum(rate(http_requests_total{service="{{repo}}"}[5m]))

agent:
  mode: subprocess
  provider: claude # claude | codex | cursor
  timeout: 10m
  # max_concurrent_fixes: 2
  # fix_mode: direct # or pr
  # fix_reverify: true          # require gate green after Fix (#2)
  # ci_rerun_before_fix: true  # flake ladder before agent (#3); default on
  # extra_env_keys: [HTTPS_PROXY]

# fleet:
#   flap_max_cycles: 3
#   flap_window: 2h
#   circuit_breach_ratio: 0.3
#   notify_webhook_url: https://hooks.slack.com/services/...
