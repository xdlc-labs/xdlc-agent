# Copy this workflow into each service repo's .github/workflows/ci.yaml.
# Monorepo users: see .github/workflows/example-service-ci.yaml at repo root.
#
# Cross-repo gitops write-back: GITHUB_TOKEN cannot push to a different
# repo. Set secrets.GITOPS_TOKEN to a PAT (or GitHub App token) with
# contents:write on GITOPS_REPO, and use that below instead of GITHUB_TOKEN.
name: ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: write
  packages: write

env:
  SERVICE: example-service
  GITOPS_REPO: your-org/xdlc
  IMAGE: ghcr.io/your-org/example-service

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: go test ./...
      - run: go build ./...

  build-push-tag:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: meta
        run: |
          SHA="${GITHUB_SHA::7}"
          docker build -t "${IMAGE}:sha-${SHA}" .
          docker push "${IMAGE}:sha-${SHA}"
          echo "tag=sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Update gitops image tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          # Prefer GITOPS_TOKEN (PAT) for cross-repo push; fall back to
          # GITHUB_TOKEN only when this workflow lives in the gitops repo.
          GITHUB_TOKEN: ${{ secrets.GITOPS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITOPS_REPO}.git" gitops-checkout
          cd gitops-checkout
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout develop || git checkout -b develop
          sed -i "s/tag: .*/tag: \"${TAG}\"/" "gitops/values/dev/${SERVICE}.yaml"
          git add "gitops/values/dev/${SERVICE}.yaml"
          git diff --staged --quiet || git commit -m "ci(${SERVICE}): bump dev image to ${TAG} [skip ci]"
          git push origin develop
