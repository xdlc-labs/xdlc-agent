# PRODUCTION overrides for helm/service-template — GitOps tracks `main`.
# Reached only via fast-forward promote (internal/promote), never by a
# direct push to main. Real users, rollback-first.
replicaCount: 3

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: contour
  tls: true

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
