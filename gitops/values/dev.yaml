# DEV overrides for helm/service-template — GitOps tracks `develop`.
# ArgoCD Application resources (gitops/apps/dev/*.yaml) point at this
# repo + this file per service. This is "the gate": if it breaks here,
# it breaks before promote, not in prod.
replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false

ingress:
  enabled: true
  className: contour
  tls: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
