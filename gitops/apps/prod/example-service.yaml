apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-example-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/xdlc.git
    targetRevision: main
    path: helm/service-template
    helm:
      valueFiles:
        - ../../gitops/values/prod.yaml
        # Same image tag file DEV was gated on — promote (internal/promote)
        # fast-forwards develop->main, this file moves with it unchanged.
        - ../../gitops/values/prod/example-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: false # rollback-first: don't auto-heal prod, let revert (dispatch.Revert) drive it
    syncOptions:
      - CreateNamespace=true
