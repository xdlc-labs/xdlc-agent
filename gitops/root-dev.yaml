# App-of-apps root: point ArgoCD at this once, it discovers every
# Application manifest under gitops/apps/dev/*.yaml. `kubectl apply -f`
# this (or let your ArgoCD bootstrap script do it) — after that, adding
# a new service is "drop a file in gitops/apps/dev/", no ArgoCD CLI use.
#
# Multi-cluster: use gitops/clusters/applicationset-root.yaml instead of
# this file + root-prod.yaml (see gitops/clusters/README.md). Kind keeps
# applying these roots via scripts/bootstrap-local.sh --with-gitops.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/xdlc.git
    targetRevision: main # the gitops repo's own manifests are tracked from main, not develop
    path: gitops/apps/dev
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
