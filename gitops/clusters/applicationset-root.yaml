# Multi-cluster app-of-apps roots via ApplicationSet (list generator).
# Kind / single-cluster users: keep applying gitops/root-{dev,prod}.yaml —
# do not also apply this file (duplicate Applications).
#
# ponytail: list generator, not cluster generator — no live cluster-secret
# API required for the example to be valid in git. Switch to cluster
# generator when ArgoCD cluster inventory should drive membership.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-roots
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: local-dev
            server: https://kubernetes.default.svc
            path: gitops/apps/dev
          - cluster: local-prod
            server: https://kubernetes.default.svc
            path: gitops/apps/prod
          # Real remote cluster: register with ArgoCD first, then add:
          # - cluster: us-east-1
          #   server: https://XXXX.gr7.us-east-1.eks.amazonaws.com
          #   path: gitops/apps/prod
  template:
    metadata:
      name: 'root-{{cluster}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/your-org/xdlc.git
        targetRevision: main
        path: '{{path}}'
        directory:
          recurse: false
      destination:
        server: '{{server}}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
